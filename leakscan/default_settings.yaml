crawl:
  max_depth: 3
  max_pages_per_domain: 100
  max_pages: 5000
  concurrency: 10
  timeout_seconds: 15
  retry_count: 2
  retry_backoff_seconds: 1.0
  per_host_delay_seconds: 1.0
  max_html_bytes: 2097152
  max_redirects: 10
  respect_robots_txt: true
  user_agent: "Leakscan/{version} (+public-reference research; metadata-only archive checks)"

search:
  providers:
    - duckduckgo
    - commoncrawl
    - archive_org
    - urlscan
    - brave
    - bing
    - google
    - github
    - gitlab
    - virustotal
    - otx
  results_per_query: 20
  max_queries_per_provider: 15
  max_pivot_rounds: 20
  max_pivots_per_round: 50
  provider_failure_threshold: 2
  provider_rate_limit_cooldown_seconds: 300
  safe_search: "off"
  intent_terms:
    - leak
    - breach
    - dump
    - mirror
    - download

scoring:
  likely_threshold: 50
  high_confidence_threshold: 90
  filename_similarity_threshold: 95
  size_tolerance_fraction: 0.08

safety:
  archive_extensions:
    - .tar.gz
    - .tar.bz2
    - .7z.001
    - .part01.rar
    - .7z
    - .zip
    - .zipx
    - .rar
    - .tar
    - .gz
    - .bz2
    - .xz
    - .tgz
    - .tbz2
    - .zst
    - ".001"
  allowed_schemes:
    - http
    - https
  reject_private_networks: true
