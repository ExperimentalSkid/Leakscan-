[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "leakscan-osint"
version = "1.0.0"
description = "Catalog-first public-reference discovery and metadata-only verification for OSINT investigations"
readme = "README.md"
requires-python = ">=3.11"
license = "LicenseRef-Proprietary"
license-files = ["LICENSE"]
authors = [
  { name = "ExperimentalSkid" },
]
keywords = ["osint", "threat-intelligence", "evidence", "crawler", "incident-response"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Information Technology",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
]
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "dnspython>=2.6,<3",
  "httpx[http2]>=0.27,<1",
  "PyYAML>=6.0,<7",
  "rapidfuzz>=3.9,<4",
  "tldextract>=5.1,<6",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "pytest>=8.2,<9",
  "pytest-asyncio>=0.23,<1",
  "ruff>=0.6,<1",
  "twine>=5,<7",
]

[project.scripts]
leakscan = "leakscan.main:main"

[project.urls]
Homepage = "https://github.com/ExperimentalSkid/Leakscan-"
Repository = "https://github.com/ExperimentalSkid/Leakscan-"
Issues = "https://github.com/ExperimentalSkid/Leakscan-/issues"

[tool.setuptools.packages.find]
include = ["leakscan*"]

[tool.setuptools.package-data]
leakscan = ["default_settings.yaml", "py.typed", "examples/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM"]

[tool.coverage.run]
branch = true
source = ["leakscan"]
